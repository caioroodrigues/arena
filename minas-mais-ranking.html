<title>Minas Mais Ranking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: moldura de celular centralizada; topo + conteúdo rolável + barra de abas. Telão em tela cheia, sempre escuro. */
:root{
  --bg:#F2EFEE; --surface:#FFFFFF; --surface2:#F7F5F4; --ink:#1B1919; --muted:#6A6361; --line:#E4DFDD;
  --red:#D3202A; --hero:#C4161F; --red-soft:#FCE7E8;
  --up:#17834A; --down:#C2371F; --gold:#C79A1E; --silver:#98A0A6; --bronze:#B06A3C;
  --gP:#2A9D5C; --gM:#2D6BDB; --gG:#E58A1F; --gGG:#C8102E;
  --shadow:0 1px 2px rgba(30,15,15,.06),0 6px 18px rgba(30,15,15,.06);
  --f-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E0E; --surface:#1A1818; --surface2:#242121; --ink:#F4F1F0; --muted:#A59E9C; --line:#2F2B2A;
  --red:#F0444C; --hero:#B3131C; --red-soft:#3B1719;
  --up:#4CC585; --down:#FF7A5C; --gold:#E0B33A; --silver:#B2B9BE; --bronze:#C98558;
  --gP:#4CC585; --gM:#6FA0FF; --gG:#F2A24E; --gGG:#F26A70;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E0E; --surface:#1A1818; --surface2:#242121; --ink:#F4F1F0; --muted:#A59E9C; --line:#2F2B2A;
  --red:#F0444C; --hero:#B3131C; --red-soft:#3B1719;
  --up:#4CC585; --down:#FF7A5C; --gold:#E0B33A; --silver:#B2B9BE; --bronze:#C98558;
  --gP:#4CC585; --gM:#6FA0FF; --gG:#F2A24E; --gGG:#F26A70;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-b);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,p{margin:0}
small{color:var(--muted);font-size:12.5px}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.stage{height:100%;display:flex;justify-content:center;align-items:center}
.phone{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:720px){
  .stage{padding:20px 0}
  .phone{height:min(100%,880px);border-radius:34px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(30,10,10,.18)}
}
.gut{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--hero);color:#fff;display:grid;place-items:center;font:800 20px var(--f-d);letter-spacing:.5px;flex:none}
.ttl{flex:1;min-width:0}
.ttl small{display:block;line-height:1.1}
.ttl h1{font:700 24px/1 var(--f-d);text-transform:uppercase;letter-spacing:.5px}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);position:relative;flex:none}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.av{font:700 15px var(--f-d);background:var(--ink);color:var(--bg)}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:6px 24px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex:none}

/* barra de abas */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.2px}
.tab[aria-current="page"]{color:var(--red)}

/* blocos */
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sh h2{font:700 19px var(--f-d);text-transform:uppercase;letter-spacing:.6px}
.k{font:600 11.5px var(--f-b);text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:16px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px)}
.hero .k{color:rgba(255,255,255,.78)}
.hero h2{font:800 30px/1.05 var(--f-d);text-transform:uppercase;margin-top:4px}
.hero .tag{font:600 12.5px var(--f-b);margin-top:2px;color:rgba(255,255,255,.85)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 10px;min-width:0}
.stats b{display:block;font:800 26px/1 var(--f-d)}
.stats span{font-size:11.5px;color:rgba(255,255,255,.8);line-height:1.2;display:block;margin-top:2px}
.gchip{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--f-d);letter-spacing:.8px;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:999px;color:var(--gc);background:color-mix(in srgb,var(--gc) 14%,transparent)}
.gchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gc)}
.hero .gchip{color:#fff;background:rgba(255,255,255,.18)}
.hero .gchip::before{background:#fff}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--red-soft);border-radius:14px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--red) 35%,transparent)}
.alert svg{color:var(--red);flex:none;margin-top:2px}
.alert b{font-weight:600}
.pill{display:inline-block;font:700 11px var(--f-d);letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.on{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.pill.end{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.pill.draft{background:var(--surface2)}

.cc{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%}
.mono{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 18px var(--f-d)}
.cm{min-width:0}
.cm b{display:block;font-weight:600;line-height:1.2}
.tbar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.cr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cr .big{font:800 30px/1 var(--f-d)}

.dl{font:700 12.5px var(--f-d);letter-spacing:.3px}
.dl.up{color:var(--up)}.dl.dn{color:var(--down)}.dl.eq{color:var(--muted)}

/* chips de campanha */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip small{color:inherit;opacity:.7;margin-left:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:600}

/* cards de grupo */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--surface);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);border:2px solid transparent;display:flex;flex-direction:column;gap:2px;min-width:0}
.gcard[aria-pressed="true"]{border-color:var(--gc)}
.gcard:disabled{opacity:.5;cursor:default}
.gcard .gt{font:800 15px var(--f-d);letter-spacing:.8px;text-transform:uppercase;color:var(--gc);display:flex;justify-content:space-between;align-items:center}
.gcard b{font-weight:600;line-height:1.2;margin-top:4px}
.gcard .v{font:700 17px var(--f-d)}
.note{font-size:12.5px;color:var(--muted)}

/* pódio */
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px}
.pcol{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.pcol b{font-size:13.5px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.pcol .v{font:700 15px var(--f-d)}
.pcol.me b{color:var(--red)}
.pblock{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:6px;font:800 34px/1 var(--f-d);color:#fff;margin-top:4px;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px)}
.p1 .pblock{height:92px;background-color:var(--gold)}
.p2 .pblock{height:64px;background-color:var(--silver)}
.p3 .pblock{height:46px;background-color:var(--bronze)}
.medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--f-d);color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.p1 .medal{width:40px;height:40px;font-size:21px;background:var(--gold)}
.p2 .medal{background:var(--silver)}.p3 .medal{background:var(--bronze)}

/* linhas de ranking */
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:12px}
.row.me{background:var(--red-soft);box-shadow:inset 0 0 0 1.5px var(--red)}
.pos{font:700 21px var(--f-d);color:var(--muted)}
.rn{min-width:0}
.rn b{font-weight:600;display:block;line-height:1.2}
.rv{text-align:right;font:700 17px var(--f-d)}
.rv .dl{display:block;margin-top:-2px}
.rbar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--gc,var(--red));border-radius:3px}
.list{display:flex;flex-direction:column;gap:2px}

/* loja */
.big-pos{display:flex;align-items:flex-end;gap:12px}
.big-pos .n{font:800 76px/.8 var(--f-d);color:var(--red)}
.big-pos .t{padding-bottom:2px}
.climb{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.climb .k{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.climb .lead{font:700 25px/1.1 var(--f-d)}
.climb .lead em{font-style:normal;color:#FF7B82}
.climb p{font-size:13.5px;color:color-mix(in srgb,var(--bg) 78%,transparent)}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px;position:relative}
.meter i{display:block;height:100%;background:var(--red);border-radius:6px}
.ng{display:flex;flex-direction:column;gap:8px}
.nb{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.nb.me{background:var(--red-soft);box-shadow:inset 0 0 0 1.5px var(--red)}
.chart text{font:600 11px var(--f-b);fill:var(--muted)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--red);stroke-width:2}
.chart .pe{fill:var(--red);stroke:var(--surface);stroke-width:3}
.chart .lb{fill:var(--red);font:800 15px var(--f-d)}

/* supervisão */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile b{display:block;font:800 26px/1.05 var(--f-d)}
.tile small{display:block;line-height:1.25}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 4px;border-top:1px solid var(--line);align-items:center}
.srow:first-child{border-top:0}
.srow b{font-weight:600}
.hbar{display:grid;grid-template-columns:78px 1fr 84px;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.hbar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--red);border-radius:5px}
.hbar span:last-child{text-align:right;font:700 15px var(--f-d)}

/* admin */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{padding:8px 4px;border-radius:9px;text-align:center;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--hero);color:#fff;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.warn{background:var(--ink);color:var(--bg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lbl{font:600 12px var(--f-b);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
input[type=text],input[type=date],select{font:inherit;width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface2);font-weight:600;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop svg{color:var(--red)}
.tw{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{font:600 11px var(--f-b);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:6px 8px;white-space:nowrap}
td{padding:8px;border-top:1px solid var(--line);white-space:nowrap}
tr.err td{background:var(--red-soft)}
.ok{color:var(--up);font-weight:600}.bad{color:var(--down);font-weight:600}
.lojas{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:44px 1fr 110px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}

/* campeões */
.champ{display:flex;flex-direction:column;gap:12px}
.ch-g{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start;padding-top:10px;border-top:1px solid var(--line)}
.ch-g:first-of-type{border-top:0;padding-top:0}
.ch-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.ch-l div{display:flex;gap:8px;align-items:center;min-width:0}
.ch-l .medal{width:22px;height:22px;font-size:13px;flex:none}
.ch-l .m1{background:var(--gold)}.ch-l .m2{background:var(--silver)}.ch-l .m3{background:var(--bronze)}
.ch-l span.n{min-width:0}
.ch-l .first{font-weight:700}
.trophy{color:var(--gold)}

/* menus */
.back{position:absolute;inset:0;background:rgba(10,5,5,.45);z-index:30}
.sheet{position:absolute;z-index:31;top:58px;right:max(12px,env(safe-area-inset-right,0px));left:max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:8px;max-height:76%;overflow-y:auto}
@media (min-width:480px){.sheet{left:auto;width:360px}}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;padding:10px 12px;border-radius:12px}
.opt[aria-checked="true"]{background:var(--red-soft)}
.opt b{font-weight:600}
.nt{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.nt:last-child{border-bottom:0}
.nt i{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px}
.nt p{font-size:14px;line-height:1.3}
.nt small{display:block;margin-top:2px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:min(90vw,380px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* telão */
.tv{--bg:#0C0B0B;--surface:#1A1818;--ink:#fff;--muted:#A59E9C;--line:#2F2B2A;--gP:#4CC585;--gM:#6FA0FF;--gG:#F2A24E;--gGG:#F26A70;--red:#F0444C;
  position:fixed;inset:0;z-index:100;background:#0C0B0B;color:#fff;display:flex;flex-direction:column;gap:18px;padding:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow:auto}
.tvh{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tvh .logo{width:52px;height:52px;font-size:28px}
.tvh h2{font:800 clamp(28px,4.4vw,56px)/1 var(--f-d);text-transform:uppercase}
.tvh .k{color:#FF7B82}
.tvr{margin-left:auto;text-align:right}
.tvr b{display:block;font:800 clamp(26px,3.4vw,44px)/1 var(--f-d)}
.tvr span{color:var(--muted);font-size:14px}
.tvg{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.tvc{background:#161414;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--gc)}
.tvc h3{font:800 clamp(24px,2.6vw,34px)/1 var(--f-d);color:var(--gc);text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:baseline}
.tvc h3 small{font:600 13px var(--f-b);letter-spacing:0;text-transform:none;color:var(--muted)}
.tvr1{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center}
.tvr1 .pos{font:800 clamp(24px,2.4vw,34px) var(--f-d);color:var(--muted)}
.tvr1:first-of-type .pos{color:var(--gold)}
.tvr1 b{font:600 clamp(15px,1.5vw,20px) var(--f-b)}
.tvr1 .v{font:700 clamp(18px,1.8vw,26px) var(--f-d)}
.tvr1 .bb{grid-column:2/4;height:8px;border-radius:4px;background:#2a2625;overflow:hidden}
.tvr1 .bb i{display:block;height:100%;background:var(--gc);border-radius:4px;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.tvf{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.tvp{flex:1;min-width:120px;height:4px;background:#2a2625;border-radius:2px;overflow:hidden}
.tvp i{display:block;height:100%;background:var(--red);animation:fill 9s linear both}
.tvf button{padding:8px 16px;border-radius:10px;background:#2a2625;color:#fff;font-weight:600}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fill{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="root"></div>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const TODAY=new Date(2026,9,29), DAY=864e5;
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=s=>{const x=D(s);return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')};
const daysLeft=c=>Math.max(0,Math.round((D(c.end)-TODAY)/DAY));
const elapsed=c=>Math.min(1,Math.max(0,(TODAY-D(c.start))/(D(c.end)-D(c.start))));
const nf=n=>Math.round(n).toLocaleString('pt-BR');
const p1=n=>n.toFixed(1).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hash=str=>{let h=2166136261;for(const ch of String(str)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const $=s=>document.querySelector(s);

function build(c){
  const r=rng(hash(c.id)), e=c.status==='encerrada'?1:Math.max(.08,elapsed(c)), L=LABS[c.lab];
  c.scores={};c.prev={};c.rev={};
  stores.forEach(s=>{
    const gm={P:.6,M:1,G:1.6,GG:2.5}[s.group];
    const rev=Math.round((16000+r()*26000)*gm*(.25+.75*e));
    const units=Math.round(rev/L.price);
    let sc=c.metric==='valor'?rev:c.metric==='unidades'?units:c.metric==='pontos'?units*L.ppu:Math.round((4+r()*28)*10)/10;
    const f=.74+r()*.2;
    c.rev[s.id]=rev;c.scores[s.id]=sc;
    c.prev[s.id]=c.metric==='crescimento'?Math.round(sc*f*10)/10:Math.round(sc*f);
  });
}
camps.forEach(build);

/* ---------- ranking (sempre dentro do mesmo grupo) ---------- */
function rank(c,g,prev){const src=prev?c.prev:c.scores;return stores.filter(s=>s.group===g).map(s=>({s,v:src[s.id]})).sort((a,b)=>b.v-a.v||a.s.id-b.s.id)}
function posInfo(c,s){const r=rank(c,s.group);return{i:r.findIndex(x=>x.s.id===s.id),r}}
function delta(c,s){return rank(c,s.group,true).findIndex(x=>x.s.id===s.id)-posInfo(c,s).i}
const goalFor=(c,g)=>{const r=rank(c,g);const a=r.reduce((t,x)=>t+x.v,0)/r.length;return c.metric==='crescimento'?20:Math.round(a*1.2)};
function hist(c,s){
  const W=5,out=[];
  for(let w=1;w<=W;w++){
    const l=stores.filter(x=>x.group===s.group).map(x=>({id:x.id,v:c.scores[x.id]*(w===W?1:(w/W)*(.8+rng(hash(x.id+'|'+c.id+'|'+w))()*.4))})).sort((a,b)=>b.v-a.v);
    out.push(l.findIndex(x=>x.id===s.id));
  }
  return out;
}

const gapf=(c,v)=>METRIC[c.metric].gap(c.metric==='crescimento'?Math.round(v*10)/10:v);

/* ---------- componentes ---------- */
const gchip=g=>`<span class="gchip" style="--gc:var(--g${g})">Grupo ${g}</span>`;
const dlt=n=>n>0?`<span class="dl up">▲ ${n}</span>`:n<0?`<span class="dl dn">▼ ${-n}</span>`:`<span class="dl eq">— </span>`;
const medal=n=>`<span class="medal">${n}</span>`;

function rowHtml(c,it,i,max,gc){
  const me=it.s.id===ME.id;
  return `<div class="row ${me?'me':''}" style="--gc:var(--g${gc})"><span class="pos">${i+1}º</span>
    <div class="rn"><b>${esc(it.s.name)}${me?' (sua loja)':''}</b><div class="rbar"><i style="width:${Math.max(4,it.v/max*100)}%"></i></div></div>
    <div class="rv">${fmt(c,it.v)}${dlt(delta(c,it.s))}</div></div>`;
}
function podium(c,r){
  const o=[1,0,2];
  return `<div class="podium">${o.map(k=>{const it=r[k];if(!it)return'<div></div>';
    return `<div class="pcol p${k+1} ${it.s.id===ME.id?'me':''}">${medal(k+1)}<b>${esc(it.s.name)}</b><span class="v">${fmt(c,it.v)}</span><div class="pblock">${k+1}</div></div>`}).join('')}</div>`;
}
function campChips(list){
  return `<div class="chips" role="group" aria-label="Campanha">${list.map(c=>`<button class="chip" data-act="camp" data-id="${c.id}" aria-pressed="${c.id===S.camp}">${esc(c.lab)}${c.status==='encerrada'?'<small>encerrada</small>':''}</button>`).join('')}</div>`;
}
function campMeta(c){
  const dl=daysLeft(c);
  return `<div class="meta"><span>Métrica: <b>${METRIC[c.metric].label}</b></span><span>Período: <b>${fd(c.start)} a ${fd(c.end)}</b></span>
   <span>${c.status==='encerrada'?'<b>Encerrada</b>':dl===0?'<b>Último dia</b>':'Restam <b>'+dl+' dias</b>'}</span><span>Desempate: <b>${esc(c.tie)}</b></span></div>`;
}
function curCamp(list){return list.find(c=>c.id===S.camp)||list[0]}

/* ---------- telas ---------- */
function home(){
  const act=active(), isStore=S.role==='vend'||S.role==='ger', R=ROLES[S.role];
  let hero;
  if(isStore){
    const parts=act.filter(c=>c.groups.includes(ME.group));
    const best=Math.min(...parts.map(c=>posInfo(c,ME).i))+1;
    const net=parts.reduce((t,c)=>t+delta(c,ME),0);
    hero=`<div class="hero"><span class="k">Sua loja</span><h2>${esc(ME.name)}</h2><div class="tag">${gchip(ME.group)} &nbsp;Venda. Supere. Conquiste.</div>
     <div class="stats"><div><b>${parts.length}</b><span>campanhas ativas</span></div><div><b>${best}º</b><span>melhor posição</span></div><div><b>${net>0?'+':''}${net}</b><span>posições na semana</span></div></div></div>`;
  }else if(S.role==='sup'){
    const mine=stores.filter(s=>s.sup===MYSUP);
    let top3=0;act.forEach(c=>mine.forEach(s=>{if(c.groups.includes(s.group)&&posInfo(c,s).i<3)top3++}));
    hero=`<div class="hero"><span class="k">Supervisão</span><h2>${MYSUP}</h2><div class="tag">Venda. Supere. Conquiste.</div>
     <div class="stats"><div><b>${mine.length}</b><span>lojas sob sua supervisão</span></div><div><b>${act.length}</b><span>campanhas ativas</span></div><div><b>${top3}</b><span>posições no top 3</span></div></div></div>`;
  }else{
    hero=`<div class="hero"><span class="k">Painel administrativo</span><h2>Olá, David</h2><div class="tag">Venda. Supere. Conquiste.</div>
     <div class="stats"><div><b>${act.length}</b><span>campanhas ativas</span></div><div><b>${stores.length}</b><span>lojas em 4 grupos</span></div><div><b>28/10</b><span>última importação</span></div></div></div>`;
  }
  const ending=act.filter(c=>daysLeft(c)<=3).map(c=>{
    let extra='';
    if(isStore&&c.groups.includes(ME.group)){const p=posInfo(c,ME);extra=p.i===0?` Você lidera o Grupo ${ME.group}.`:` Você está em ${p.i+1}º no Grupo ${ME.group}: faltam ${gapf(c,p.r[0].v-p.r[p.i].v)} para o 1º.`}
    return `<div class="alert">${ic('clock')}<p><b>${esc(c.lab)} encerra em ${daysLeft(c)} dias.</b>${extra}</p></div>`}).join('');
  const cards=act.map(c=>{
    const p=c.groups.includes(ME.group)?posInfo(c,ME):null, dl=daysLeft(c);
    const right=isStore?(p?`<span class="big">${p.i+1}º</span><small>de ${p.r.length} · Grupo ${ME.group}</small>${dlt(delta(c,ME))}`:'<small>Sem lojas<br>do seu grupo</small>'):`<span class="big">${dl}</span><small>dias restantes</small>`;
    return `<button class="card cc" data-act="opencamp" data-id="${c.id}"><span class="mono">${esc(c.lab.slice(0,2).toUpperCase())}</span>
      <div class="cm"><b>${esc(c.name)}</b><small>${fd(c.start)} a ${fd(c.end)} · ${METRIC[c.metric].label}</small><div class="tbar"><i style="width:${Math.round(elapsed(c)*100)}%"></i></div></div><div class="cr">${right}</div></button>`}).join('');
  const last=camps.filter(c=>c.status==='encerrada')[0];
  const lc=last?`<div class="card"><div class="sh"><h2>Campeões recentes</h2><button class="k" data-act="tab" data-t="champ" style="color:var(--red)">Ver todos</button></div>
    <small>${esc(last.name)}</small><div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">${last.groups.map(g=>`<div>${gchip(g)}<div style="font-weight:600;margin-top:4px">${esc(rank(last,g)[0].s.name)}</div></div>`).join('')}</div></div>`:'';
  const tvb=R.tv?`<button class="card" data-act="tv" style="display:flex;align-items:center;gap:12px;width:100%"><span class="mono" style="background:var(--hero);color:#fff">${ic('tv')}</span><div><b style="font-weight:600">Abrir Modo Telão</b><br><small>Ranking ao vivo para TVs e reuniões</small></div></button>`:'';
  return hero+ending+`<div class="sh"><h2>Campanhas ativas</h2><span class="k">${act.length} em andamento</span></div><div style="display:flex;flex-direction:column;gap:10px">${cards}</div>`+tvb+lc;
}

function rankTab(){
  const list=camps.filter(c=>c.status!=='rascunho'), c=curCamp(list);
  if(!c.groups.includes(S.grp))S.grp=c.groups[0];
  const g=S.grp, r=rank(c,g), max=r[0].v;
  const gcards=GK.map(k=>{
    if(!c.groups.includes(k))return `<button class="gcard" disabled style="--gc:var(--g${k})"><span class="gt">Grupo ${k}</span><b>Fora da campanha</b><small>${GN[k]}</small></button>`;
    const rr=rank(c,k);
    return `<button class="gcard" data-act="grp" data-g="${k}" aria-pressed="${k===g}" style="--gc:var(--g${k})"><span class="gt">Grupo ${k}<small>${rr.length} lojas</small></span><b>${esc(rr[0].s.name)}</b><span class="v">${fmt(c,rr[0].v)}</span></button>`}).join('');
  return campChips(list)+`<div><h2 style="font:800 28px/1.05 var(--f-d);text-transform:uppercase">${esc(c.name)}</h2>${campMeta(c)}</div>
   <div class="gg">${gcards}</div>

   <div class="card"><div class="sh"><h2>Classificação do Grupo ${g}</h2><small>${GN[g]}</small></div><div class="list" style="margin-top:8px">${r.map((it,i)=>rowHtml(c,it,i,max,g)).join('')}</div></div>
   <p class="note">Cada grupo disputa apenas entre lojas do mesmo porte. Lojas de grupos diferentes nunca são comparadas.</p>`;
}

function chart(arr,n){
  const w=320,h=150,pl=30,pr=16,pt=14,pb=24,X=i=>pl+i*(w-pl-pr)/(arr.length-1),Y=p=>pt+p*(h-pt-pb)/(n-1);
  let g='';for(let p=0;p<n;p++)g+=`<line class="g" x1="${pl}" x2="${w-pr}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${pl-8}" y="${Y(p)+4}" text-anchor="end">${p+1}º</text>`;
  const d=arr.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1)).join(' ');
  const labels=['S1','S2','S3','S4','Hoje'];
  const pts=arr.map((p,i)=>i<arr.length-1?`<circle class="pt" cx="${X(i)}" cy="${Y(p)}" r="4"/>`:`<circle class="pe" cx="${X(i)}" cy="${Y(p)}" r="7"/>`).join('');
  const x=labels.map((l,i)=>`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${l}</text>`).join('');
  const last=arr.length-1;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Evolução da posição por semana">${g}<path class="ln" d="${d}"/>${pts}${x}<text class="lb" x="${X(last)}" y="${Y(arr[last])-12}" text-anchor="middle">${arr[last]+1}º</text></svg>`;
}

function storeTab(){
  const list=active().filter(c=>c.groups.includes(ME.group)), c=curCamp(list), P=posInfo(c,ME), r=P.r, i=P.i, me=r[i];
  const goal=goalFor(c,ME.group), pc=Math.min(100,Math.round(me.v/goal*100)), L=LABS[c.lab], prod=L.prods[0];
  let climb;
  if(i>0){
    const gap=r[i-1].v-me.v;
    let hint='';
    if(c.metric==='valor')hint=`Isso equivale a cerca de ${Math.ceil(gap/L.price)} unidades de “${prod}”.`;
    else if(c.metric==='unidades')hint=`Foque em “${prod}” para ganhar giro rápido.`;
    else if(c.metric==='pontos')hint=`Cada unidade de “${prod}” vale ${L.ppu} pontos: cerca de ${Math.ceil(gap/L.ppu)} unidades.`;
    else hint='Aumente a venda dos itens da campanha em relação ao período anterior.';
    climb=`<div class="climb"><span class="k">Suba no ranking</span><div class="lead">Faltam <em>${gapf(c,gap)}</em> para ultrapassar ${esc(r[i-1].s.name)}</div><p>Você chega ao ${i}º lugar do Grupo ${ME.group}. ${hint}</p></div>`;
  }else{
    climb=`<div class="climb"><span class="k">Você lidera</span><div class="lead">1º lugar no Grupo ${ME.group}, com <em>${gapf(c,me.v-r[1].v)}</em> de vantagem</div><p>${esc(r[1].s.name)} está logo atrás. Mantenha o ritmo até ${fd(c.end)}.</p></div>`;
  }
  const ab=r[i-1],bl=r[i+1];
  const nb=(it,k,rel)=>`<div class="nb ${rel==='me'?'me':''}"><span class="pos">${k+1}º</span><b style="font-weight:600">${esc(it.s.name)}${rel==='me'?' (você)':''}</b><span class="rv">${rel==='me'?fmt(c,it.v):(rel==='up'?'+':'−')+gapf(c,Math.abs(it.v-me.v))}</span></div>`;
  return campChips(list)+`<div class="card"><div class="sh"><span class="k">Posição atual · ${esc(c.name)}</span>${gchip(ME.group)}</div>
    <div class="big-pos" style="margin-top:12px"><span class="n">${i+1}º</span><div class="t"><b style="font:700 20px var(--f-d)">de ${r.length} lojas</b><br>${dlt(delta(c,ME))} <small>vs. semana anterior</small></div></div>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:baseline"><span class="k">${METRIC[c.metric].label}</span><b style="font:800 24px var(--f-d)">${fmt(c,me.v)}</b></div>
    <div class="meter" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pc}%"></i></div>
    <small style="display:block;margin-top:6px">${pc}% da meta de ${fmt(c,goal)}${pc<100?' · faltam '+gapf(c,goal-me.v):' · meta batida'}</small></div>`
   +climb+`<div class="card"><div class="sh"><h2>Quem está ao redor</h2><small>Grupo ${ME.group}</small></div><div class="ng" style="margin-top:10px">${ab?nb(ab,i-1,'up'):''}${nb(me,i,'me')}${bl?nb(bl,i+1,'dn'):''}</div></div>`
   +`<div class="card"><div class="sh"><h2>Evolução da posição</h2><small>Últimas 5 semanas</small></div><div style="margin-top:8px">${chart(hist(c,ME),r.length)}</div></div>`
   +`<div class="card"><div class="sh"><h2>Produtos da campanha</h2><small>${esc(c.lab)}</small></div><div style="margin-top:6px">${L.prods.map(p=>`<div class="srow"><span>${esc(p)}</span><small>${c.metric==='pontos'?L.ppu+' pts/un':'participa'}</small></div>`).join('')}</div></div>`;
}

function supTab(){
  const list=active(), c=curCamp(list), mine=stores.filter(s=>s.sup===MYSUP);
  const part=mine.filter(s=>c.groups.includes(s.group)).map(s=>{const p=posInfo(c,s);return{s,i:p.i,n:p.r.length,v:c.scores[s.id],lead:p.r[0].v,pc:p.i/(p.r.length-1),gr:(c.scores[s.id]/c.prev[s.id]-1)*100}});
  const best=[...part].sort((a,b)=>a.pc-b.pc)[0], worst=[...part].sort((a,b)=>b.pc-a.pc)[0];
  const avg=part.reduce((t,x)=>t+x.gr,0)/part.length;
  const labs=list.map(k=>({k,v:mine.filter(s=>k.groups.includes(s.group)).reduce((t,s)=>t+k.rev[s.id],0)}));
  const mx=Math.max(...labs.map(x=>x.v));
  const rows=GK.map(g=>{const it=part.filter(x=>x.s.group===g);if(!it.length)return'';
    return `<div style="margin-top:6px">${gchip(g)}</div>`+it.sort((a,b)=>a.i-b.i).map(x=>`<div class="srow"><div><b>${esc(x.s.name)}</b><br><small>${x.i+1}º de ${x.n} · ${x.i===0?'líder do grupo':gapf(c,x.lead-x.v)+' do 1º'}</small></div><div class="rv">${fmt(c,x.v)}${dlt(delta(c,x.s))}</div></div>`).join('')}).join('');
  return campChips(list)+`<div class="tiles">
    <div class="tile"><small>Melhor loja</small><b>${esc(best.s.name)}</b><small>${best.i+1}º no Grupo ${best.s.group}</small></div>
    <div class="tile"><small>Pede atenção</small><b>${esc(worst.s.name)}</b><small>${worst.i+1}º de ${worst.n} no Grupo ${worst.s.group}</small></div>
    <div class="tile"><small>Lojas na campanha</small><b>${part.length} de ${mine.length}</b><small>${esc(c.lab)}</small></div>
    <div class="tile"><small>Crescimento médio</small><b>${avg>=0?'+':''}${p1(avg)}%</b><small>vs. semana anterior</small></div></div>
   <div class="card"><div class="sh"><h2>Suas lojas · ${esc(c.lab)}</h2></div>${rows}<p class="note" style="margin-top:10px">A posição de cada loja vale só para o ranking do próprio grupo.</p></div>
   <div class="card"><div class="sh"><h2>Vendas por laboratório</h2><small>suas ${mine.length} lojas</small></div>${labs.map(x=>`<div class="hbar"><span>${esc(x.k.lab)}</span><div class="tr"><i style="width:${x.v/mx*100}%"></i></div><span>R$ ${nf(x.v/1000)} mil</span></div>`).join('')}</div>`;
}

function adminTab(){
  const sub=S.adminTab;
  const seg=`<div class="seg" role="group">${[['camps','Campanhas'],['imp','Importar vendas'],['lojas','Lojas e grupos']].map(([k,l])=>`<button data-act="asub" data-k="${k}" aria-pressed="${sub===k}">${l}</button>`).join('')}</div>`;
  if(sub==='camps'){
    const form=S.newForm?`<form class="card form" id="ncform"><div class="sh"><h2>Nova campanha</h2></div>
     <div class="fld"><label for="nc-name">Nome</label><input type="text" id="nc-name" placeholder="Ex.: Bayer Novembro Forte" required></div>
     <div class="two"><div class="fld"><label for="nc-lab">Laboratório</label><select id="nc-lab">${Object.keys(LABS).map(l=>`<option>${l}</option>`).join('')}</select></div>
     <div class="fld"><label for="nc-metric">Métrica</label><select id="nc-metric">${Object.entries(METRIC).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('')}</select></div></div>
     <div class="two"><div class="fld"><label for="nc-start">Início</label><input type="date" id="nc-start" value="2026-10-29"></div><div class="fld"><label for="nc-end">Término</label><input type="date" id="nc-end" value="2026-11-30"></div></div>
     <div class="fld"><span class="lbl">Grupos participantes</span><div class="checks">${GK.map(g=>`<label><input type="checkbox" id="nc-g-${g}" checked> ${g}</label>`).join('')}</div></div>
     <div class="fld"><label for="nc-tie">Critério de desempate</label><select id="nc-tie"><option>Maior número de unidades</option><option>Maior valor vendido</option><option>Maior mix de produtos</option></select></div>
     <div class="fld"><label for="nc-st">Status inicial</label><select id="nc-st"><option value="ativa">Ativa</option><option value="rascunho">Rascunho</option></select></div>
     <div class="acts"><button class="btn" type="submit">Criar campanha</button><button class="btn ghost" type="button" data-act="newform">Cancelar</button></div></form>`:'';
    const items=camps.map(c=>{
      const st=c.status==='ativa'?'<span class="pill on">Ativa</span>':c.status==='encerrada'?'<span class="pill end">Encerrada</span>':'<span class="pill draft">Rascunho</span>';
      let a='';
      if(c.status==='rascunho')a=`<button class="btn sm" data-act="activate" data-id="${c.id}">Ativar</button>`;
      if(c.status==='ativa')a=S.confirmClose===c.id?`<button class="btn sm warn" data-act="close" data-id="${c.id}">Confirmar encerramento</button><button class="btn sm ghost" data-act="cancelclose">Voltar</button>`:`<button class="btn sm ghost" data-act="close" data-id="${c.id}">Encerrar</button>`;
      if(c.status==='encerrada')a='<small>Bloqueada para alterações</small>';
      return `<div class="card"><div class="sh"><b style="font-weight:600">${esc(c.name)}</b>${st}</div><small>${esc(c.lab)} · ${fd(c.start)} a ${fd(c.end)} · ${METRIC[c.metric].label}</small><br><small>Grupos: ${c.groups.join(', ')} · Desempate: ${esc(c.tie)}</small><div class="acts">${a}</div></div>`}).join('');
    return seg+`<button class="btn" data-act="newform" style="align-self:flex-start">${ic('plus',18)} Nova campanha</button>`+form+items;
  }
  if(sub==='imp'){
    if(!S.imp)return seg+`<div class="card"><div class="drop">${ic('upload',34)}<b>Importe o arquivo de vendas</b><small>Excel ou CSV com Data, Loja, Produto, Laboratório, Quantidade e Valor. O app identifica loja, grupo, laboratório, produto e campanha.</small><button class="btn" data-act="sample">Usar arquivo de exemplo</button><small>vendas_28-10-2026.xlsx</small></div></div>`;
    const rows=S.imp.rows;
    const okN=rows.filter(r=>r.ok).length;
    const t=`<div class="tw"><table><thead><tr><th>Data</th><th>Loja</th><th>Produto</th><th>Lab.</th><th>Qtd</th><th>Valor</th><th>Grupo</th><th>Campanha</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.ok?'':'err'}"><td>${r.date}</td><td>${esc(r.sname)}</td><td>${esc(r.prod)}</td><td>${r.lab}</td><td>${r.qty}</td><td>R$ ${nf(r.val)}</td><td>${r.ok?gchip(r.store.group):'—'}</td><td>${r.ok?`<span class="ok">${esc(r.camp.name)}</span>`:`<span class="bad">${r.err}</span>`}</td></tr>`).join('')}</tbody></table></div>`;
    let foot;
    if(S.imp.done)foot=`<div class="alert" style="background:color-mix(in srgb,var(--up) 14%,transparent);border-color:var(--up)"><p><b>Importação concluída.</b> Rankings recalculados.<br>${S.imp.moves.map(m=>esc(m)).join('<br>')}</p></div><div class="acts"><button class="btn ghost" data-act="resetimp">Nova importação</button></div>`;
    else foot=`<p class="note"><b class="ok">${okN} linhas reconhecidas</b> · <b class="bad">${rows.length-okN} com erro</b> (ignoradas). Confirme para recalcular os rankings.</p><div class="acts"><button class="btn" data-act="doimport">Confirmar importação</button><button class="btn ghost" data-act="resetimp">Cancelar</button></div>`;
    return seg+`<div class="card"><div class="sh"><h2>Prévia da importação</h2><small>vendas_28-10-2026.xlsx</small></div><div style="margin-top:8px">${t}</div>${foot}</div>`;
  }
  return seg+`<div class="card"><div class="sh"><h2>Lojas e grupos</h2><small>${stores.length} lojas</small></div><p class="note" style="margin:4px 0 6px">Mudar o grupo move a loja para outro ranking.</p><div class="lojas">${stores.map(s=>`<div class="lrow"><small>${s.code}</small><div><b style="font-weight:600">${esc(s.name)}</b><br><small>${s.sup}</small></div><select data-act="setgroup" data-id="${s.id}" aria-label="Grupo de ${esc(s.name)}">${GK.map(g=>`<option value="${g}" ${g===s.group?'selected':''}>Grupo ${g}</option>`).join('')}</select></div>`).join('')}</div></div>`;
}

function champTab(){
  const closed=camps.filter(c=>c.status==='encerrada');
  const tally={};
  closed.forEach(c=>c.groups.forEach(g=>{const w=rank(c,g)[0].s;tally[w.name]=(tally[w.name]||0)+1}));
  const t=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const hdr=`<div class="hero" style="text-align:left"><span class="k">Hall da fama</span><h2>Campeões Minas Mais</h2><div class="tag">${closed.length} campanhas encerradas · campeões por grupo</div></div>`;
  const cards=closed.map(c=>`<div class="card champ"><div class="sh"><h2>${esc(c.name)}</h2><span class="pill end">Final</span></div><small>${fd(c.start)} a ${fd(c.end)} · ${METRIC[c.metric].label}</small>
    ${c.groups.map(g=>{const r=rank(c,g);return `<div class="ch-g"><div>${gchip(g)}</div><div class="ch-l">${[0,1,2].map(k=>`<div><span class="medal m${k+1}">${k+1}</span><span class="n ${k===0?'first':''}">${esc(r[k].s.name)}</span><small style="margin-left:auto">${fmt(c,r[k].v)}</small></div>`).join('')}</div></div>`}).join('')}</div>`).join('');
  const tb=`<div class="card"><div class="sh"><h2>Quadro de títulos</h2><small>1º lugares em grupos</small></div>${t.map(([n,k])=>`<div class="srow"><b>${esc(n)}</b><span class="rv trophy">${k} ${k===1?'título':'títulos'}</span></div>`).join('')}</div>`;
  return hdr+tb+cards;
}

/* ---------- notificações ---------- */
function notes(){
  const out=[];
  active().filter(c=>c.groups.includes(ME.group)).forEach((c,k)=>{
    const p=posInfo(c,ME),d=delta(c,ME),t=['agora','há 1 h','há 3 h','ontem'][k]||'ontem';
    if(p.i===0)out.push([`Você lidera o Grupo ${ME.group} na campanha ${c.lab}.`,t]);
    else if(d>0)out.push([`Você subiu ${d} posição${d>1?'ões':''} na ${c.lab}: agora ${p.i+1}º no Grupo ${ME.group}.`,t]);
    else if(d<0)out.push([`Você caiu para ${p.i+1}º na ${c.lab}. Faltam ${gapf(c,p.r[p.i-1].v-p.r[p.i].v)} para recuperar a posição.`,t]);
    if(p.i>0)out.push([`Faltam ${gapf(c,p.r[0].v-p.r[p.i].v)} para o 1º lugar na ${c.lab}.`,t]);
    if(daysLeft(c)<=3)out.push([`A campanha ${c.lab} encerra em ${daysLeft(c)} dias.`,'hoje']);
  });
  const c=active()[0],g=rank(c,'G')[0];
  out.push([`${g.s.name} lidera o Grupo G na campanha ${c.lab}.`,'ontem']);
  return out.slice(0,8);
}

/* ---------- render ---------- */
function render(){
  const R=ROLES[S.role];
  if(!R.tabs.includes(S.tab))S.tab='home';
  const sc=$('.scroll'),keep=sc?sc.scrollTop:0,same=sc&&sc.dataset.t===S.tab;
  const body={home,rank:rankTab,store:storeTab,sup:supTab,admin:adminTab,champ:champTab}[S.tab]();
  const ns=notes();
  $('#root').innerHTML=`<div class="stage"><div class="phone">
   <header class="top gut"><div class="logo" aria-hidden="true">M+</div><div class="ttl"><small>Minas Mais Ranking</small><h1>${TABN[S.tab]}</h1></div>
    ${R.tv?`<button class="ib" data-act="tv" aria-label="Abrir Modo Telão">${ic('tv')}</button>`:''}
    <button class="ib" data-act="notif" aria-label="Notificações">${ic('bell')}<span class="dot"></span></button>
    <button class="ib av" data-act="menu" aria-label="Trocar perfil: ${R.label}">${R.label[0]}</button></header>
   <main class="scroll gut" data-t="${S.tab}">${body}</main>
   <nav class="tabs" aria-label="Navegação">${R.tabs.map(t=>`<button class="tab" data-act="tab" data-t="${t}" ${t===S.tab?'aria-current="page"':''}>${ic(t)}<span>${TABN[t]}</span></button>`).join('')}</nav>
   ${S.menu?`<div class="back" data-act="menu"></div><div class="sheet" role="radiogroup" aria-label="Perfil"><p class="k" style="padding:8px 12px 4px">Ver como</p>${Object.entries(ROLES).map(([k,r])=>`<button class="opt" role="radio" aria-checked="${k===S.role}" data-act="role" data-r="${k}"><b>${r.label}</b><span></span><small style="grid-column:1/3">${r.desc}</small></button>`).join('')}<p class="note" style="padding:8px 12px">Protótipo com dados fictícios. O perfil muda o que cada pessoa vê.</p></div>`:''}
   ${S.notif?`<div class="back" data-act="notif"></div><div class="sheet"><p class="k" style="padding:8px 12px 4px">Notificações</p>${ns.map(n=>`<div class="nt"><i></i><div><p>${esc(n[0])}</p><small>${n[1]}</small></div></div>`).join('')}</div>`:''}
  </div></div>`;
  const ns2=$('.scroll');if(ns2&&same)ns2.scrollTop=keep;
}

/* ---------- telão ---------- */
let tvTimer=null;
function paintTv(){
  const act=active(),c=act[S.tvi%act.length];
  const clock=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  $('#tv').innerHTML=`<div class="tvh"><div class="logo">M+</div><div><span class="k">Ranking ao vivo · ${esc(c.lab)}</span><h2>${esc(c.name)}</h2></div><div class="tvr"><b>${clock}</b><span>${METRIC[c.metric].label} · restam ${daysLeft(c)} dias</span></div></div>
   <div class="tvg">${GK.map(g=>{
     if(!c.groups.includes(g))return `<div class="tvc" style="--gc:var(--g${g})"><h3>Grupo ${g}</h3><small style="color:var(--muted)">Fora desta campanha</small></div>`;
     const r=rank(c,g),mx=r[0].v;
     return `<div class="tvc" style="--gc:var(--g${g})"><h3>Grupo ${g}<small>${GN[g]}</small></h3>${r.slice(0,5).map((it,i)=>`<div class="tvr1"><span class="pos">${i+1}º</span><b>${esc(it.s.name)}</b><span class="v">${fmt(c,it.v)}</span><div class="bb"><i style="width:${it.v/mx*100}%;animation-delay:${i*.08}s"></i></div></div>`).join('')}</div>`}).join('')}</div>
   <div class="tvf"><span>Cada grupo compete só com lojas do mesmo porte</span><div class="tvp"><i></i></div><span>${(S.tvi%act.length)+1} de ${act.length}</span><button data-act="closetv">Sair do telão</button></div>`;
}
function openTv(){
  S.tv=true;S.tvi=0;let el=$('#tv');if(!el){el=document.createElement('div');el.id='tv';el.className='tv';el.setAttribute('role','dialog');el.setAttribute('aria-label','Modo Telão');document.body.appendChild(el)}
  paintTv();clearInterval(tvTimer);tvTimer=setInterval(()=>{S.tvi++;paintTv()},9000);
}
function closeTv(){S.tv=false;clearInterval(tvTimer);const el=$('#tv');if(el)el.remove()}

/* ---------- toast ---------- */
let tt;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;requestAnimationFrame(()=>t.classList.add('on'));clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- importação de exemplo ---------- */
function sampleRows(){
  const q=[[ME.name,'Bayer',0,360,12240],[ME.name,'EMS',0,180,3420],['Betim Centro','Bayer',1,150,6900],['Nova Lima','Hypera',2,210,5460],['Savassi','Eurofarma',0,140,5740],['BH Centro','EMS',1,260,6500],['Sabará','Bayer',2,90,2520],['L99','Bayer',0,40,1360]];
  return q.map(([n,lab,pi,qty,val])=>{
    const st=stores.find(s=>s.name===n||s.code===n),c=active().find(k=>k.lab===lab&&st&&k.groups.includes(st.group));
    const row={date:'28/10/2026',sname:st?st.code+' '+st.name:n,prod:LABS[lab].prods[pi],lab,qty,val,store:st,camp:c,ok:!!(st&&c)};
    if(!st)row.err='Loja não encontrada';else if(!c)row.err='Sem campanha ativa';
    return row});
}
function doImport(){
  const before={};active().forEach(c=>{if(c.groups.includes(ME.group))before[c.id]=posInfo(c,ME).i});
  S.imp.rows.filter(r=>r.ok).forEach(r=>{const c=r.camp,s=r.store,L=LABS[c.lab];c.rev[s.id]+=r.val;
    const add=c.metric==='valor'?r.val:c.metric==='unidades'?r.qty:c.metric==='pontos'?r.qty*L.ppu:0.6;
    c.scores[s.id]=c.metric==='crescimento'?Math.round((c.scores[s.id]+add)*10)/10:Math.round(c.scores[s.id]+add)});
  S.imp.moves=Object.keys(before).map(id=>{const c=camps.find(x=>x.id===id),a=posInfo(c,ME).i,b=before[id];
    return `${ME.name} em ${c.lab}: ${a<b?b+1+'º → '+(a+1)+'º':a>b?b+1+'º → '+(a+1)+'º':'mantém '+(a+1)+'º'}`});
  S.imp.done=true;toast('Vendas importadas e rankings atualizados');
}

/* ---------- eventos ---------- */
const root=$('#root');
root.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;
  const a=el.dataset.act;
  switch(a){
    case'tab':S.tab=el.dataset.t;S.menu=S.notif=false;break;
    case'camp':S.camp=el.dataset.id;break;
    case'opencamp':S.camp=el.dataset.id;S.tab='rank';{const c=camps.find(x=>x.id===S.camp);S.grp=c.groups.includes(ME.group)?ME.group:c.groups[0]}break;
    case'grp':S.grp=el.dataset.g;break;
    case'menu':S.menu=!S.menu;S.notif=false;break;
    case'notif':S.notif=!S.notif;S.menu=false;break;
    case'role':S.role=el.dataset.r;S.menu=false;S.tab='home';toast('Perfil: '+ROLES[S.role].label);break;
    case'tv':S.menu=S.notif=false;openTv();break;
    case'asub':S.adminTab=el.dataset.k;break;
    case'newform':S.newForm=!S.newForm;break;
    case'activate':{const c=camps.find(x=>x.id===el.dataset.id);c.status='ativa';toast(c.name+' ativada')}break;
    case'close':{if(S.confirmClose===el.dataset.id){const c=camps.find(x=>x.id===el.dataset.id);c.status='encerrada';S.confirmClose=null;toast('Campanha encerrada. Campeões definidos por grupo.')}else S.confirmClose=el.dataset.id}break;
    case'cancelclose':S.confirmClose=null;break;
    case'sample':S.imp={rows:sampleRows(),done:false};break;
    case'doimport':doImport();break;
    case'resetimp':S.imp=null;break;
    case'closetv':closeTv();return;
    default:return;
  }
  render();
});
root.addEventListener('change',e=>{
  const el=e.target;if(el.dataset.act==='setgroup'){const s=stores.find(x=>x.id==el.dataset.id);s.group=el.value;toast(s.name+' agora está no Grupo '+s.group)}
});
document.addEventListener('click',e=>{if(e.target.closest('#tv')&&e.target.closest('[data-act="closetv"]'))closeTv()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.tv)closeTv();else if(S.menu||S.notif){S.menu=S.notif=false;render()}}});
root.addEventListener('submit',e=>{
  if(e.target.id!=='ncform')return;e.preventDefault();
  const name=$('#nc-name').value.trim(),start=$('#nc-start').value,end=$('#nc-end').value,gs=GK.filter(g=>$('#nc-g-'+g).checked);
  if(!name||!start||!end||end<start){toast('Confira o nome e as datas da campanha');return}
  if(!gs.length){toast('Escolha ao menos um grupo');return}
  const c={id:'c'+Date.now(),lab:$('#nc-lab').value,name,start,end,metric:$('#nc-metric').value,groups:gs,status:$('#nc-st').value,tie:$('#nc-tie').value};
  build(c);camps.push(c);S.newForm=false;toast('Campanha criada');render();
});

render();
})();
</script>
